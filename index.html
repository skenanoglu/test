<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tavuk</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; touch-action: none; font-family: sans-serif; color: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px; font-size: 20px; font-weight: bold; pointer-events: none; }
  .ekran { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; text-align: center; gap: 16px; padding: 16px; }
  .ekran h1 { font-size: 56px; margin: 0; }
  .ekran p { font-size: 18px; margin: 0; color: #555; }
  button { font-size: 22px; padding: 12px 32px; border: 2px solid #000; background: #fff; color: #000; border-radius: 12px; }
  #son h1 { color: #e0245e; font-size: 40px; }
  #butonlar { display: flex; gap: 16px; }
  #hayir { transition: left .15s, top .15s; }
  #cevap { font-size: 24px; color: #e0245e; min-height: 30px; }
  .gizli { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="skor">🐍 0</span><span id="sure">0:30</span></div>

<div id="giris" class="ekran">
  <p>Tavuğu parmağınla sürükle, yılanları ye! 🐔</p>
  <button id="basla">Başla</button>
</div>

<div id="son" class="ekran gizli">
  <h1>Kocişin seni çok seviyor, biliyor muydun? ❤️</h1>
  <div id="butonlar"><button id="evet">Evet</button><button id="hayir">Hayır</button></div>
  <p id="cevap"></p>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SURE = 30; // saniye
let W, H, tavuk, hedef, yilanlar = [], skor = 0, kalan = SURE, son, oynuyor = false, eklemeSayac;

function boyut() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', boyut); boyut();

function yeniYilan() {
  // Tavuğun dibinde doğmasın
  let x, y;
  do { x = 20 + Math.random() * (W - 40); y = 60 + Math.random() * (H - 80); }
  while (Math.hypot(x - tavuk.x, y - tavuk.y) < 150);
  const a = Math.random() * Math.PI * 2;
  const hiz = 40 + Math.random() * 40 + (SURE - kalan) * 2; // zamanla hızlanır
  return { x, y, vx: Math.cos(a) * hiz, vy: Math.sin(a) * hiz, t: Math.random() * 6 };
}

function baslat() {
  tavuk = { x: W / 2, y: H / 2, yon: 1 };
  hedef = { x: tavuk.x, y: tavuk.y };
  skor = 0; kalan = SURE; eklemeSayac = 0;
  yilanlar = [];
  for (let i = 0; i < 4; i++) yilanlar.push(yeniYilan());
  document.getElementById('giris').classList.add('gizli');
  document.getElementById('son').classList.add('gizli');
  oynuyor = true; son = performance.now();
  requestAnimationFrame(dongu);
}

function bitir() {
  oynuyor = false;
  document.getElementById('son').classList.remove('gizli');
}

function dokun(e) {
  if (!oynuyor) return;
  const p = e.touches ? e.touches[0] : e;
  hedef.x = p.clientX; hedef.y = p.clientY;
  e.preventDefault();
}
cv.addEventListener('touchstart', dokun, { passive: false });
cv.addEventListener('touchmove', dokun, { passive: false });
cv.addEventListener('mousedown', dokun);
cv.addEventListener('mousemove', e => { if (e.buttons) dokun(e); });

function dongu(simdi) {
  if (!oynuyor) return;
  const dt = Math.min((simdi - son) / 1000, 0.05); son = simdi;
  kalan -= dt;
  if (kalan <= 0) { kalan = 0; ciz(); bitir(); return; }

  // Tavuk parmağa doğru yumuşakça gider
  const dx = hedef.x - tavuk.x, dy = hedef.y - tavuk.y;
  tavuk.x += dx * Math.min(1, dt * 8);
  tavuk.y += dy * Math.min(1, dt * 8);
  if (Math.abs(dx) > 2) tavuk.yon = dx > 0 ? -1 : 1;

  for (let i = yilanlar.length - 1; i >= 0; i--) {
    const y = yilanlar[i];
    y.t += dt;
    // Kıvrılarak yürü, tavuk yaklaşınca kaç
    const kx = y.x - tavuk.x, ky = y.y - tavuk.y, d = Math.hypot(kx, ky) || 1;
    if (d < 140) { y.vx += kx / d * 120 * dt; y.vy += ky / d * 120 * dt; }
    y.x += (y.vx + Math.sin(y.t * 5) * 20) * dt;
    y.y += (y.vy + Math.cos(y.t * 5) * 20) * dt;
    if (y.x < 20 || y.x > W - 20) { y.vx *= -1; y.x = Math.max(20, Math.min(W - 20, y.x)); }
    if (y.y < 60 || y.y > H - 20) { y.vy *= -1; y.y = Math.max(60, Math.min(H - 20, y.y)); }
    if (d < 40) { yilanlar.splice(i, 1); skor++; }
  }
  // Yılan sayısı her 6 saniyede bir artar
  eklemeSayac += dt;
  const maks = 4 + Math.floor((SURE - kalan) / 6);
  if (yilanlar.length < maks && eklemeSayac > 1) { yilanlar.push(yeniYilan()); eklemeSayac = 0; }

  ciz();
  requestAnimationFrame(dongu);
}

function emoji(e, x, y, boy, ayna) {
  ctx.save(); ctx.translate(x, y); if (ayna) ctx.scale(-1, 1);
  ctx.font = boy + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, 0, 0); ctx.restore();
}

function ciz() {
  ctx.clearRect(0, 0, W, H);
  for (const y of yilanlar) emoji('🐍', y.x, y.y, 36, y.vx > 0);
  emoji('🐔', tavuk.x, tavuk.y, 56, tavuk.yon < 0);
  document.getElementById('skor').textContent = '🐍 ' + skor;
  const s = Math.ceil(kalan);
  document.getElementById('sure').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

document.getElementById('basla').onclick = baslat;
document.getElementById('evet').onclick = () => {
  document.getElementById('cevap').textContent = 'Bi de Hayır\'ı dene 😏';
};
// Hayır'a basılamaz: parmak ya da fare yaklaşınca başka yere kaçar
const hayir = document.getElementById('hayir');
function kac(e) {
  e.preventDefault();
  const r = hayir.getBoundingClientRect();
  let x, y;
  do { x = 16 + Math.random() * (innerWidth - r.width - 32); y = 16 + Math.random() * (innerHeight - r.height - 32); }
  while (Math.hypot(x - r.left, y - r.top) < 120);
  hayir.style.position = 'fixed';
  hayir.style.left = x + 'px'; hayir.style.top = y + 'px';
}
hayir.addEventListener('touchstart', kac, { passive: false });
hayir.addEventListener('mousedown', kac);
hayir.addEventListener('mouseenter', kac);
hayir.addEventListener('click', e => e.preventDefault());
</script>
</body>
</html>
